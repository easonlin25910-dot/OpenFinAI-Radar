name: Publish v0.3 product intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import v0.3 update
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/openfinai-v03.tgz').write_bytes(base64.b64decode(''))
          PY
          tar -xzf /tmp/openfinai-v03.tgz
      - name: Commit and push
        run: |
          git config user.name "openfinai-radar[bot]"
          git config user.email "openfinai-radar[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: add product identity audience and category filters"
          git push
