[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openfinai-radar"
version = "0.2.0"
description = "An evidence-first, time-windowed discovery radar for global financial AI innovation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "OpenFinAI Radar contributors"}]
keywords = ["financial-ai", "fintech", "ai-agents", "market-intelligence", "osint"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
openfinai-radar = "openfinai_radar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
